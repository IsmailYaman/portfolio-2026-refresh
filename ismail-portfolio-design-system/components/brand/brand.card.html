<!-- @dsCard group="Components" viewport="700x180" name="Brand" subtitle="Logo lockup and placeholder dot mark" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{padding:22px 24px;background:var(--ev-paper)}
.grid{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.stack{display:flex;flex-direction:column;gap:18px}
.cap{font-family:var(--ev-font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ev-n-400)}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../_dev/ds-fallback.js"></script>
</head>
<body><div id="root"></div>
<script type="text/babel" data-presets="react">
const DS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === "object" && v.Button && v.WorkCard) return v; } catch (e) {} } return {}; })();
const { Logo, Mark } = DS;
function Demo() {
  return (
    <div className="stack">
      <div className="grid" style={{gap:40}}>
        <Logo />
        <Logo size={24} />
        <Logo showMark={false} />
        <div className="grid" style={{gap:12}}><Mark size={10} /><Mark size={16} /><Mark size={24} /></div>
      </div>
      <div className="ev-inverse grid" style={{padding:"16px 18px",gap:40}}>
        <Logo inverse /><Logo inverse size={22} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
