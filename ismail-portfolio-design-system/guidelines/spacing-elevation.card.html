<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Almost none — rules and contrast replace shadow" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;background:var(--ev-paper)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{width:96px;height:56px;border-radius:var(--ev-radius-sm)}
.t{font-family:var(--ev-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ev-n-500);text-transform:uppercase}
.v{font-family:var(--ev-font-mono);font-size:10px;color:var(--ev-n-400)}
</style></head><body>
<div class="row" style="align-items:center;gap:24px;padding:8px 0 22px">
  <div class="sw"><div style="width:120px;height:64px;background:var(--ev-paper);border:1px solid var(--ev-border-hairline);box-shadow:var(--ev-shadow-none)"></div><span class="t">none</span></div>
  <div class="sw"><div style="width:120px;height:64px;background:var(--ev-paper);border:1px solid var(--ev-border-hairline);box-shadow:var(--ev-shadow-sm)"></div><span class="t">sm</span></div>
  <div class="sw"><div style="width:120px;height:64px;background:var(--ev-paper);border:1px solid var(--ev-border-hairline);box-shadow:var(--ev-shadow-md)"></div><span class="t">md</span></div>
  <div class="sw"><div style="width:120px;height:64px;background:var(--ev-paper);border:1px solid var(--ev-border-hairline);box-shadow:var(--ev-shadow-lift)"></div><span class="t">lift</span></div>
</div>
</body></html>
