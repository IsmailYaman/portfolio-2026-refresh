<!-- @dsCard group="Spacing" viewport="700x170" name="Radii" subtitle="None — every surface, button and image is square-cornered" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;background:var(--ev-paper)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}
.t{font-family:var(--ev-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ev-n-500);text-transform:uppercase}
.v{font-family:var(--ev-font-mono);font-size:10px;color:var(--ev-n-400)}
</style></head><body>
<div class="row">
  <div class="sw"><div style="width:96px;height:56px;background:var(--ev-n-100);border:1px solid var(--ev-border-hairline)"></div><span class="t">Surface</span><span class="v">0</span></div>
  <div class="sw"><div style="width:96px;height:56px;background:var(--ev-surface-media)"></div><span class="t">Media</span><span class="v">0</span></div>
  <div class="sw"><div style="width:130px;height:44px;background:var(--ev-ink)"></div><span class="t">Button</span><span class="v">0</span></div>
  <div class="sw"><div style="width:44px;height:44px;border:1px solid var(--ev-border-hairline)"></div><span class="t">Icon button</span><span class="v">0</span></div>
</div>
<p class="ev-label" style="margin-top:14px">All --ev-radius-* tokens resolve to 0. The only round shapes left are the dot glyphs of the mark.</p>
</body></html>
