<!-- @dsCard group="Colors" viewport="700x180" name="Accents" subtitle="Sampled from the artwork; ~5% of any surface" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;background:var(--ev-paper)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{width:96px;height:56px;border-radius:var(--ev-radius-sm)}
.t{font-family:var(--ev-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ev-n-500);text-transform:uppercase}
.v{font-family:var(--ev-font-mono);font-size:10px;color:var(--ev-n-400)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--ev-electric)"></div><span class="t">Electric</span><span class="v">#1F2BFF · links, focus, selection</span></div>
  <div class="sw"><div class="chip" style="background:var(--ev-signal)"></div><span class="t">Signal</span><span class="v">#FF2C00 · live dot, alerts</span></div>
  <div class="sw"><div class="chip" style="background:var(--ev-magenta)"></div><span class="t">Magenta</span><span class="v">#FE004D · hover flood</span></div>
</div>
<p class="ev-label" style="margin-top:14px">Never two accents in one view. Never an accent behind body text.</p>
</body></html>
