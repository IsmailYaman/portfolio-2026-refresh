<!-- @dsCard group="Colors" viewport="700x160" name="Core monochrome" subtitle="Paper and ink — the whole system rests on these two" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;background:var(--ev-paper)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{width:96px;height:56px;border-radius:var(--ev-radius-sm)}
.t{font-family:var(--ev-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ev-n-500);text-transform:uppercase}
.v{font-family:var(--ev-font-mono);font-size:10px;color:var(--ev-n-400)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--ev-paper);border:1px solid var(--ev-border-hairline)"></div><span class="t">Paper</span><span class="v">#FFFFFF</span></div>
  <div class="sw"><div class="chip" style="background:var(--ev-paper-tint);border:1px solid var(--ev-border-hairline)"></div><span class="t">Paper tint</span><span class="v">#F5F5F3</span></div>
  <div class="sw"><div class="chip" style="background:var(--ev-ink)"></div><span class="t">Ink</span><span class="v">#050505</span></div>
  <div class="sw"><div class="chip" style="background:var(--ev-ink-true)"></div><span class="t">Ink true</span><span class="v">#000000</span></div>
</div>
</body></html>
