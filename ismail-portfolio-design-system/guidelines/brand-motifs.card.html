<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;background:var(--ev-paper)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{width:96px;height:56px;border-radius:var(--ev-radius-sm)}
.t{font-family:var(--ev-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ev-n-500);text-transform:uppercase}
.v{font-family:var(--ev-font-mono);font-size:10px;color:var(--ev-n-400)}
</style></head><body>
<div style="display:grid;gap:14px">
  <div style="display:flex;gap:22px;align-items:center">
    <span class="ev-label">[ YEAR ]</span>
    <span class="ev-label" style="display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;border-radius:50%;background:var(--ev-signal)"></span>Limited work slot available</span>
    <span class="ev-label" style="display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;border-radius:50%;background:var(--ev-ink)"></span>Featured works</span>
  </div>
  <div style="border-top:1px solid var(--ev-border-hairline);border-bottom:1px solid var(--ev-border-hairline);padding:10px 0;display:grid;grid-template-columns:2fr 2fr 1fr;gap:16px">
    <span class="ev-h4" style="font-size:15px">Senior brand designer</span><span class="ev-meta">Jackson Kibby, Berlin</span><span class="ev-meta" style="text-align:right">2023</span>
  </div>
  <div style="overflow:hidden;white-space:nowrap"><span class="ev-h2" style="font-size:26px;opacity:.14">BRANDING — WEB DESIGN — UI/UX DESIGN — BRANDING — WEB DESIGN</span></div>
</div>
</body></html>
