<!-- @dsCard group="Spacing" viewport="700x190" name="Layout & rules" subtitle="1440 page · 1240 content · 1px hairline grid" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;background:var(--ev-paper)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{width:96px;height:56px;border-radius:var(--ev-radius-sm)}
.t{font-family:var(--ev-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ev-n-500);text-transform:uppercase}
.v{font-family:var(--ev-font-mono);font-size:10px;color:var(--ev-n-400)}
</style></head><body>
<div style="border:1px dashed var(--ev-border-hairline);padding:14px">
  <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:8px;height:60px">
    <div style="background:var(--ev-n-100)"></div><div style="background:var(--ev-n-100)"></div><div style="background:var(--ev-n-100)"></div><div style="background:var(--ev-n-100)"></div><div style="background:var(--ev-n-100)"></div><div style="background:var(--ev-n-100)"></div><div style="background:var(--ev-n-100)"></div><div style="background:var(--ev-n-100)"></div><div style="background:var(--ev-n-100)"></div><div style="background:var(--ev-n-100)"></div><div style="background:var(--ev-n-100)"></div><div style="background:var(--ev-n-100)"></div>
  </div>
  <hr class="ev-rule" style="margin:14px 0">
  <div style="display:flex;justify-content:space-between"><span class="ev-label">--ev-gutter clamp(20,4vw,64)</span><span class="ev-label">--ev-section-y clamp(72,10vw,160)</span></div>
</div>
</body></html>
