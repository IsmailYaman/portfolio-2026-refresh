<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing ramp" subtitle="4 → 200px; sections breathe at 96–200" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;background:var(--ev-paper)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{width:96px;height:56px;border-radius:var(--ev-radius-sm)}
.t{font-family:var(--ev-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ev-n-500);text-transform:uppercase}
.v{font-family:var(--ev-font-mono);font-size:10px;color:var(--ev-n-400)}
</style></head><body>
<div style="display:flex;align-items:flex-end;gap:8px">
  <div class="sw"><div style="width:34px;height:4px;background:var(--ev-ink)"></div><span class="v">4</span></div>
  <div class="sw"><div style="width:34px;height:8px;background:var(--ev-ink)"></div><span class="v">8</span></div>
  <div class="sw"><div style="width:34px;height:12px;background:var(--ev-ink)"></div><span class="v">12</span></div>
  <div class="sw"><div style="width:34px;height:16px;background:var(--ev-ink)"></div><span class="v">16</span></div>
  <div class="sw"><div style="width:34px;height:24px;background:var(--ev-ink)"></div><span class="v">24</span></div>
  <div class="sw"><div style="width:34px;height:32px;background:var(--ev-ink)"></div><span class="v">32</span></div>
  <div class="sw"><div style="width:34px;height:48px;background:var(--ev-ink)"></div><span class="v">48</span></div>
  <div class="sw"><div style="width:34px;height:64px;background:var(--ev-ink)"></div><span class="v">64</span></div>
  <div class="sw"><div style="width:34px;height:96px;background:var(--ev-ink)"></div><span class="v">96</span></div>
  <div class="sw"><div style="width:34px;height:110px;background:var(--ev-ink)"></div><span class="v">144</span></div>
</div>
</body></html>
