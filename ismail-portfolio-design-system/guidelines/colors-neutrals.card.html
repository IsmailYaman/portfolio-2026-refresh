<!-- @dsCard group="Colors" viewport="700x150" name="Neutral scale" subtitle="Hairlines, meta text and disabled states only" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;background:var(--ev-paper)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{width:96px;height:56px;border-radius:var(--ev-radius-sm)}
.t{font-family:var(--ev-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ev-n-500);text-transform:uppercase}
.v{font-family:var(--ev-font-mono);font-size:10px;color:var(--ev-n-400)}
</style></head><body>
<div style="display:grid;grid-template-columns:repeat(10,1fr);gap:4px">
  <div class="sw"><div style="height:52px;border-radius:0;background:var(--ev-n-50);border:1px solid var(--ev-border-hairline)"></div><span class="v">50</span></div>
  <div class="sw"><div style="height:52px;border-radius:0;background:var(--ev-n-100);border:1px solid var(--ev-border-hairline)"></div><span class="v">100</span></div>
  <div class="sw"><div style="height:52px;border-radius:0;background:var(--ev-n-200);"></div><span class="v">200</span></div>
  <div class="sw"><div style="height:52px;border-radius:0;background:var(--ev-n-300);"></div><span class="v">300</span></div>
  <div class="sw"><div style="height:52px;border-radius:0;background:var(--ev-n-400);"></div><span class="v">400</span></div>
  <div class="sw"><div style="height:52px;border-radius:0;background:var(--ev-n-500);"></div><span class="v">500</span></div>
  <div class="sw"><div style="height:52px;border-radius:0;background:var(--ev-n-600);"></div><span class="v">600</span></div>
  <div class="sw"><div style="height:52px;border-radius:0;background:var(--ev-n-700);"></div><span class="v">700</span></div>
  <div class="sw"><div style="height:52px;border-radius:0;background:var(--ev-n-800);"></div><span class="v">800</span></div>
  <div class="sw"><div style="height:52px;border-radius:0;background:var(--ev-n-900);"></div><span class="v">900</span></div>
</div>
</body></html>
