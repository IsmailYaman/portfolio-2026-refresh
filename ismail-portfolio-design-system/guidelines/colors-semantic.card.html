<!-- @dsCard group="Colors" viewport="700x200" name="Semantic aliases" subtitle="What to reach for instead of raw values" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;background:var(--ev-paper)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{width:96px;height:56px;border-radius:var(--ev-radius-sm)}
.t{font-family:var(--ev-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ev-n-500);text-transform:uppercase}
.v{font-family:var(--ev-font-mono);font-size:10px;color:var(--ev-n-400)}
</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 28px">
  <div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:0;background:var(--ev-text-primary);border:1px solid var(--ev-border-hairline);flex:none"></span><span class="v" style="color:var(--ev-ink);width:150px">--ev-text-primary</span><span class="t">Headlines, body</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:0;background:var(--ev-text-secondary);border:1px solid var(--ev-border-hairline);flex:none"></span><span class="v" style="color:var(--ev-ink);width:150px">--ev-text-secondary</span><span class="t">Mono meta, captions</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:0;background:var(--ev-text-muted);border:1px solid var(--ev-border-hairline);flex:none"></span><span class="v" style="color:var(--ev-ink);width:150px">--ev-text-muted</span><span class="t">Placeholders, disabled</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:0;background:var(--ev-border-hairline);border:1px solid var(--ev-border-hairline);flex:none"></span><span class="v" style="color:var(--ev-ink);width:150px">--ev-border-hairline</span><span class="t">Table + section rules</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:0;background:var(--ev-border-strong);border:1px solid var(--ev-border-hairline);flex:none"></span><span class="v" style="color:var(--ev-ink);width:150px">--ev-border-strong</span><span class="t">Outline buttons, focus frame</span></div>
  <div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:0;background:var(--ev-link-hover);border:1px solid var(--ev-border-hairline);flex:none"></span><span class="v" style="color:var(--ev-ink);width:150px">--ev-link-hover</span><span class="t">Link + hover state</span></div>
</div>
</body></html>
