<!-- @dsCard group="Type" viewport="700x180" name="Families" subtitle="Two families, no third — Archivo + JetBrains Mono (both substitutions)" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;background:var(--ev-paper)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{width:96px;height:56px;border-radius:var(--ev-radius-sm)}
.t{font-family:var(--ev-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ev-n-500);text-transform:uppercase}
.v{font-family:var(--ev-font-mono);font-size:10px;color:var(--ev-n-400)}
</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:28px">
  <div><p style="font-family:var(--ev-font-display);font-weight:800;font-size:34px;margin:0;letter-spacing:-.03em">Archivo</p><p class="ev-label" style="margin:6px 0 0">Display + text · 400 / 500 / 700 / 800</p></div>
  <div><p style="font-family:var(--ev-font-mono);font-size:28px;margin:0">JetBrains Mono</p><p class="ev-label" style="margin:6px 0 0">Labels, meta, numerals · 400 / 500</p></div>
</div>
</body></html>
