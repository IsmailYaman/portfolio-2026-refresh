<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:20px 24px;background:var(--ev-paper)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{width:96px;height:56px;border-radius:var(--ev-radius-sm)}
.t{font-family:var(--ev-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ev-n-500);text-transform:uppercase}
.v{font-family:var(--ev-font-mono);font-size:10px;color:var(--ev-n-400)}
</style></head><body>
<div style="display:flex;gap:40px;align-items:center;flex-wrap:wrap">
  <div style="display:flex;align-items:center;gap:8px">
    <span style="display:flex;gap:-2px"><span style="width:13px;height:13px;border-radius:50%;background:var(--ev-ink)"></span><span style="width:13px;height:13px;border-radius:50%;background:var(--ev-ink);margin-left:-4px"></span></span>
    <span style="font-family:var(--ev-font-display);font-weight:800;letter-spacing:-.02em;font-size:17px;text-transform:uppercase">Ismail Kayadelen</span>
  </div>
  <div class="ev-inverse" style="display:flex;align-items:center;gap:8px;padding:12px 16px">
    <span style="display:flex"><span style="width:13px;height:13px;border-radius:50%;background:var(--ev-paper)"></span><span style="width:13px;height:13px;border-radius:50%;background:var(--ev-paper);margin-left:-4px"></span></span>
    <span style="font-family:var(--ev-font-display);font-weight:800;letter-spacing:-.02em;font-size:17px;text-transform:uppercase">Ismail Kayadelen</span>
  </div>
  <img src="../assets/images/signature.png" alt="Signature" style="height:40px;opacity:.9">
</div>
</body></html>
